<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Video</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #player {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="player"></div>
    <script>
      // The loading screen runs on nui://, which YouTube rejects (error 153), so the player lives
      // here on an https origin and talks to the loading screen with postMessage.
      const params = new URLSearchParams(location.search);
      const id = params.get('v');
      const start = Number(params.get('start')) || 0;
      const volume = Math.round(Math.min(1, Math.max(0, Number(params.get('volume') ?? 0.3))) * 100);

      const PLAYING = 1;
      const ENDED = 0;
      // Not found, private, or embedding blocked. Anything else is worth retrying.
      const FATAL_ERRORS = [100, 101, 150, 152, 153];

      let player;
      let kick;
      let fade;

      const send = (type, data) => parent.postMessage({ source: 'origin-video', type, data }, '*');
      console.log('[loadscreen:video] player page loaded on', location.origin);

      // Keep calling play until it sticks, CEF can drop the first call while the player warms up
      function keepPlaying() {
        clearInterval(kick);
        const began = Date.now();
        kick = setInterval(() => {
          const waited = Date.now() - began;
          if (player.getPlayerState() === PLAYING || waited > 20000) return clearInterval(kick);
          // Normal browsers block unmuted autoplay, so go muted after a few seconds (in game this isn't needed)
          if (waited > 4000 && !player.isMuted()) {
            player.mute();
            send('muted', true);
          }
          player.playVideo();
        }, 250);
      }

      function fadeOut() {
        clearInterval(kick);
        clearInterval(fade);
        if (!player.getVolume) return;
        let v = Number(player.getVolume()) || 0;
        const step = Math.max(1, v / 25);
        fade = setInterval(() => {
          v -= step;
          if (v > 0) return player.setVolume(v);
          clearInterval(fade);
          player.pauseVideo();
        }, 80);
      }

      window.onYouTubeIframeAPIReady = () => {
        player = new YT.Player('player', {
          width: '100%',
          height: '100%',
          playerVars: {
            autoplay: 0,
            controls: 0,
            disablekb: 1,
            fs: 0,
            iv_load_policy: 3,
            modestbranding: 1,
            playsinline: 1,
            rel: 0,
          },
          events: {
            onReady: () => {
              send('ready', location.origin);
              player.setVolume(volume);
              player.unMute();
              player.loadVideoById({ videoId: id, startSeconds: start });
              keepPlaying();
            },
            onStateChange: (e) => {
              send('state', e.data);
              if (e.data === ENDED) {
                player.seekTo(start);
                player.playVideo();
              }
            },
            onError: (e) => {
              send('error', e.data);
              if (FATAL_ERRORS.includes(e.data)) clearInterval(kick);
              else keepPlaying();
            },
          },
        });
      };

      window.addEventListener('message', (e) => {
        const m = e.data;
        if (!player || !m || m.target !== 'origin-video') return;
        if (m.cmd === 'mute') player.mute();
        if (m.cmd === 'unmute') {
          player.unMute();
          player.setVolume(volume);
        }
        if (m.cmd === 'fadeOut') fadeOut();
      });

      if (!id) send('error', 'no video id');
    </script>
    <script src="https://www.youtube.com/iframe_api" onerror="send('error', 'YouTube API failed to load')"></script>
  </body>
</html>
